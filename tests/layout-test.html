<!doctype html><meta charset="utf-8"><title>徒歩パネル配置テスト</title>
<h1>地図と徒歩パネルの重なりテスト</h1><pre id="results">実行中…</pre>
<iframe id="preview" src="../index.html" style="width:390px;height:844px;border:1px solid #aaa"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),output=document.querySelector('#results'),log=[];
await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
const doc=frame.contentDocument;doc.querySelector('[data-purpose="shelter"]').click();
doc.querySelector('#close-place-picker').click();doc.querySelector('#toggle-journey-fields').click();
const settle=()=>new Promise(resolve=>setTimeout(resolve,100));
function check(label){const m=doc.querySelector('#gsi-map').getBoundingClientRect(),p=doc.querySelector('#walking-panel').getBoundingClientRect();if(!(m.right<=p.left||p.right<=m.left||m.bottom<=p.top||p.bottom<=m.top))throw Error(label+'：重なりあり');const workspace=doc.querySelector('.walking-workspace').getBoundingClientRect();if(Math.abs(workspace.width-m.width)>2)throw Error(label+'：地図幅が縮小');const edit=doc.querySelector('.walk-edit-group');const buttons=[...edit.querySelectorAll('button')].map(b=>b.getBoundingClientRect());if(buttons.some(b=>Math.abs(b.top-buttons[0].top)>2))throw Error(label+'：編集ボタンが離れている');log.push('PASS '+label+'：地図は全幅・重なりなし・編集3ボタン横並び');output.textContent=log.join('\n');}
try{
 for(const width of [390,768,1280]){
  frame.style.width=width+'px';await settle();
  const toggle=doc.querySelector('#walk-toggle'),assist=doc.querySelector('#header-information .assist-menu');
  const b=toggle.getBoundingClientRect(),a=assist.getBoundingClientRect();
  if(!doc.querySelector('#header-information').contains(toggle)||b.right>a.left+1||Math.abs(b.top-a.top)>8)throw Error(width+'px ヘッダー配置不正');
  log.push('PASS '+width+'px 徒歩ボタンがみやすさ・ことばの左');
if(!doc.querySelector('#walking-panel').hidden)throw Error('初期状態が閉じていない');const closedHeight=doc.querySelector('#gsi-map').getBoundingClientRect().height;doc.querySelector('#walk-toggle').click();await settle();const openHeight=doc.querySelector('#gsi-map').getBoundingClientRect().height;if(closedHeight<=openHeight)throw Error(width+'px 閉じても地図が拡大しない');log.push('PASS '+width+'px 閉じると地図が拡大');check(width+'px 通常表示');
  doc.querySelector('#map-expand').click();await settle();check(width+'px 全画面表示');
  doc.querySelector('#map-fullscreen-close').click();doc.querySelector('#walk-toggle').click();await settle();
 }
 frame.style.width='390px';await settle();
 output.textContent=log.join('\n')+'\n全12項目成功';
}catch(error){output.textContent=log.join('\n')+'\nFAIL '+error.message;}
</script>
