<!doctype html><meta charset="utf-8"><title>立体歩行者の連続回転</title><link rel="stylesheet" href="../css/walking.css?v=44-walk35">
<style>body{font:16px system-ui;background:#f3f7f5;color:#173f36;padding:24px}h1{font-size:24px}.direction-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:18px;max-width:1000px}article{background:white;border:1px solid #b9cfc4;border-radius:12px;padding:18px;text-align:center}.sample{height:170px;display:flex;align-items:center;justify-content:center}canvas.walker-canvas{width:108px;height:164px}p{line-height:1.7}.orbit{display:flex;align-items:center;gap:32px;margin:12px 0 20px}</style>
<h1>見える面が連続して変わる、立体の歩行者</h1><p>頭・胴体・手足を立体として描画。画像の切り替え・傾け・重ね合わせを使わず、向きが連続して変わります。</p>
<div class="orbit"><canvas id="orbit" class="walker-canvas"></canvas><strong id="bearing"></strong></div><div class="direction-grid"></div>
<script type="module">
import {createWalker3D} from '../js/walker-3d.js?v=44-walk35';
const actors=[],names=['北：後ろ姿','北東：斜め後ろ','東：側面','南東：斜め前','南：正面','南西：斜め前','西：側面','北西：斜め後ろ'];
for(let i=0;i<8;i++){const a=document.createElement('article');a.innerHTML=`<div class="sample"><canvas class="walker-canvas"></canvas></div><strong>${names[i]}</strong>`;document.querySelector('.direction-grid').append(a);actors.push(createWalker3D(a.querySelector('canvas')));}
const orbit=createWalker3D(document.querySelector('#orbit'));let start;
function tick(now){start??=now;const angle=(now-start)/3500;orbit.draw(angle,true,now);document.querySelector('#bearing').textContent=`連続回転：${(angle*180/Math.PI%360).toFixed(1)}°`;for(let i=0;i<8;i++)actors[i].draw(i*Math.PI/4,true,now);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
