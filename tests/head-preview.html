<!doctype html><meta charset="utf-8"><title>頭部の描画確認</title><style>body{font:16px system-ui;background:#f3f7f5;color:#173f36;padding:24px}.heads{display:grid;grid-template-columns:repeat(4,220px);gap:16px}article{padding:16px;text-align:center;border:1px solid #b7cfc3;border-radius:10px;background:white}canvas{width:180px;height:230px}</style><h1>頭と髪の面の重なりを修正</h1><p>同じ立体表面を髪と肌に塗り分けています。別の髪の塊は重ねていません。</p><div class="heads"></div><script type="module">
import {createWalker3D} from '../js/walker-3d.js?v=44-walk35';
for(let i=0;i<8;i++){const source=document.createElement('canvas'),actor=createWalker3D(source);source.width=648;source.height=984;actor.draw(i*Math.PI/4,false,1000);const card=document.createElement('article');card.innerHTML=`<canvas width="360" height="460"></canvas><p>${['後ろ','斜め後ろ','横','斜め前','正面','斜め前','横','斜め後ろ'][i]}</p>`;const c=card.querySelector('canvas').getContext('2d');c.drawImage(source,18*648/64,6*984/96,28*648/64,36*984/96,0,0,360,460);document.querySelector('.heads').append(card);}
</script>
